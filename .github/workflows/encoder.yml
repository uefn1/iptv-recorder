name: encoder
on:
  workflow_dispatch:
    inputs:
      id:
        required: true
        type: string
permissions:
  contents: write
jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y ffmpeg jq -qq
      - name: encode
        run: |
          ID="${{ inputs.id }}"; RAW="recordings/raw/${ID}_best.ts"; QUEUE="queue/${ID}.json"
          START=$(jq -r .start $QUEUE); DUR=$(jq -r .duration $QUEUE)
          FIRST_PTS=$(ffprobe -v error -select_streams v:0 -show_entries packet=pts_time -of csv=p=0 "$RAW" | head -n1); [ -z "$FIRST_PTS" ] && FIRST_PTS=0
          MTIME=$(stat -c %Y "$RAW"); OFFSET=$(( MTIME - START )); [ $OFFSET -lt 0 ] && OFFSET=0
          CUT=$(awk "BEGIN{print $OFFSET + $FIRST_PTS}")
          mkdir -p recordings
          ffmpeg -y -ss $CUT -i "$RAW" -t "$DUR" -c:v libx264 -preset veryfast -crf 23 -c:a aac -b:a 128k recordings/${ID}.mp4
          ffmpeg -y -ss $CUT -i "$RAW" -t "$DUR" -c copy recordings/${ID}.ts
      - name: cleanup
        run: |
          ID="${{ inputs.id }}"; rm -rf recordings/raw/${ID}_best.ts; rm -f queue/${ID}.json
          git config user.name "uefn1"; git config user.email "uefn1@users.noreply.github.com"
          git add -A; git commit -m "encode $ID [skip ci]" || true
          git pull --rebase origin main; git push origin main || true
