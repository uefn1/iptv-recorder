name: recorder-parallel
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 400
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg jq -qq
          pip install awscli -q

      - name: record + encode + upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_BUCKET: iptv-archive
        run: |
          set +e
          shopt -s nullglob
          mkdir -p /tmp/work
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          for f in queue/*.json; do
            [ -e "$f" ] || continue
            ID=$(jq -r .id $f)
            URL=$(jq -r .url $f)
            START=$(jq -r .start $f)
            DUR=$(jq -r .duration $f)

            echo "=== $ID ==="
            OPTS="-reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 60 -rw_timeout 15000000 -user_agent Mozilla/5.0"
            ffmpeg -y $OPTS -i "$URL" -t "$DUR" -c copy /tmp/work/${ID}_a.ts &
            ffmpeg -y $OPTS -i "$URL" -t "$DUR" -c copy /tmp/work/${ID}_b.ts &
            ffmpeg -y $OPTS -i "$URL" -t "$DUR" -c copy /tmp/work/${ID}_c.ts &
            wait

            BEST=$(ls -S /tmp/work/${ID}_*.ts 2>/dev/null | head -n1)
            if [ ! -s "$BEST" ]; then echo "録画失敗"; continue; fi
            cp -f "$BEST" /tmp/work/${ID}_best.ts
            RAW="/tmp/work/${ID}_best.ts"

            PTS=$(ffprobe -v error -select_streams v:0 -show_entries packet=pts_time -of csv=p=0 "$RAW" | head -n1 | tr -d '\r')
            if ! echo "$PTS" | grep -Eq '^[0-9.]+$'; then PTS=0; fi
            MTIME=$(stat -c %Y "$RAW")
            OFFSET=$(( MTIME - START )); [ $OFFSET -lt 0 ] && OFFSET=0; [ $OFFSET -gt 30 ] && OFFSET=30
            CUT=$(awk -v o=$OFFSET -v p=$PTS 'BEGIN{print o+p}')
            if ! echo "$CUT" | grep -Eq '^[0-9.]+$'; then CUT=0; fi
            echo "PTS=$PTS OFFSET=$OFFSET CUT=$CUT"

            ffmpeg -y -ss $CUT -i "$RAW" -t "$DUR" -c:v libx264 -preset veryfast -crf 23 -c:a aac -b:a 128k /tmp/work/${ID}.mp4
            ffmpeg -y -ss $CUT -i "$RAW" -t "$DUR" -c copy /tmp/work/${ID}.ts

            if [ ! -f /tmp/work/${ID}.mp4 ]; then echo "mp4生成失敗"; ls -lh /tmp/work/; continue; fi

            aws s3 cp /tmp/work/${ID}.mp4 s3://${R2_BUCKET}/recordings/${ID}.mp4 --endpoint-url $ENDPOINT
            aws s3 cp /tmp/work/${ID}.ts s3://${R2_BUCKET}/recordings/${ID}.ts --endpoint-url $ENDPOINT
            
            if [ $? -eq 0 ]; then
              echo "DONE -> ${R2_PUBLIC_URL}/recordings/${ID}.mp4"
            else
              echo "UPLOAD FAILED"
              exit 1
            fi
            rm -f /tmp/work/${ID}_*
          done

      - name: cleanup queue
        run: |
          rm -rf queue/*.json
          git config user.name "uefn1"
          git config user.email "uefn1@users.noreply.github.com"
          git add -A
          git commit -m "record done [skip ci]" || true
          git pull --rebase origin main
          git push origin main || true
