name: Auto 5:00-7:20 JST delay-safe
on:
  schedule:
    - cron: '45 19 * * *' # JST 4:45起動 = 5:00の15分前、遅延しても5:00に間に合う
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - name: 4:45まで待機してから2時間35分録画
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg jq -qq

          # 手動で今(4:07)押した場合は4:45まで待機
          NOW=$(TZ=Asia/Tokyo date +%s)
          TARGET=$(TZ=Asia/Tokyo date -d "04:45 today" +%s)
          if [ $NOW -lt $TARGET ]; then
            SLEEP=$((TARGET - NOW))
            echo "遅延対策で $SLEEP 秒待って4:45に開始します"
            sleep $SLEEP
          fi

          # 4:45から7:20まで = 2時間35分 = 9300秒
          # 遅れて5:00に始まっても7:35まで録るので5:00-7:20は確実にカバー
          ffmpeg -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 30 \
            -i "${{ secrets.IPTV_URL }}" -t 9300 \
            -c:v libx264 -preset veryfast -crf 28 -c:a aac -b:a 96k -y rec_full.mp4

          # 5:00-7:20だけを切り出し(最初の15分をカット)
          ffmpeg -ss 900 -i rec_full.mp4 -t 8400 -c copy rec.mp4

      - name: R2へアップロード
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone config create r2 s3 provider Cloudflare access_key_id $R2_ACCESS_KEY secret_access_key $R2_SECRET_KEY endpoint https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com
          DATE=$(date +"%Y%m%d_%H%M")
          FILE="rec_${DATE}.mp4"
          rclone copy rec.mp4 r2:iptv-archive/videos/$FILE --progress
          rclone copy r2:iptv-archive/manifest.json ./ 2>/dev/null || echo '{"videos":[]}' > manifest.json
          URL="${{ secrets.R2_PUBLIC_URL }}/videos/$FILE"
          jq --arg t "録画 $DATE 5:00-7:20" --arg f "$FILE" --arg u "$URL" --arg d "$(date -Iseconds)" '.videos |= [{title:$t, filename:$f, url:$u, recorded_at:$d}] + .' manifest.json > new.json
          mv new.json manifest.json
          rclone copy manifest.json r2:iptv-archive/
