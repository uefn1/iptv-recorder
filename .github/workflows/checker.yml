name: checker
on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: checker-queue
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: trigger recorders in parallel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          NOW=$(date +%s)
          for f in queue/*.json; do
            [ -e "$f" ] || continue
            ID=$(jq -r .id $f)
            URL=$(jq -r .url $f)
            DUR=$(jq -r .duration $f)
            START=$(jq -r .start $f)
            if [ $START -le $NOW ]; then
              echo "trigger $ID"
              gh workflow run recorder.yml -f id=$ID -f url=$URL -f duration=$DUR
              sleep 1
            fi
          done
