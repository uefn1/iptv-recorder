name: Checker
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    paths:
      - queue.json

permissions:
  contents: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 10分監視 + recorder起動
        env:
          IPTV_URL: ${{ secrets.IPTV_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          sudo apt-get install -y ffmpeg jq curl -qq
          START=$(date +%s)
          END=$((START + 600))

          is_online() {
            CODE=$(curl -L -s -o /dev/null -w "%{http_code}" -A "VLC/3.0.20" "$IPTV_URL" --max-time 10)
            [ "$CODE" = "200" ]
          }

          while [ $(date +%s) -lt $END ]; do
            git fetch origin main --quiet
            git reset --hard origin/main --quiet
            [ -f queue.json ] || echo '[]' > queue.json
            NOW=$(date +%s)

            # 期限切れ削除
            TMP_Q="[]"
            jq -c '.[]' queue.json > /tmp/rows.txt || true
            while IFS= read -r row; do
              JST=$(echo "$row" | jq -r .jst_datetime)
              TARGET=$(TZ=Asia/Tokyo date -d "$JST" +%s 2>/dev/null || echo 0)
              if [ $((NOW - TARGET)) -ge 600 ]; then echo "expired $JST"; else TMP_Q=$(echo "$TMP_Q" | jq --argjson r "$row" '. += [$r]'); fi
            done < /tmp/rows.txt
            echo "$TMP_Q" > queue.json

            FOUND=""
            while IFS= read -r row; do
              JST=$(echo "$row" | jq -r .jst_datetime)
              TARGET=$(TZ=Asia/Tokyo date -d "$JST" +%s)
              REMAIN=$((TARGET - NOW))
              if [ $REMAIN -le 300 ] && [ $REMAIN -ge -60 ]; then FOUND="$row"; break; fi
            done < /tmp/rows.txt

            if [ -z "$FOUND" ]; then sleep 30; continue; fi

            JST=$(echo "$FOUND" | jq -r .jst_datetime)
            DUR=$(echo "$FOUND" | jq -r .duration_minutes)
            echo ">>> 5分前検知 $JST ${DUR}分"

            # .ts先行取得
            set +e
            if ! is_online; then echo "オフライン"; sleep 60; continue; fi
            timeout 20 ffmpeg -reconnect 1 -rw_timeout 10000000 -user_agent "VLC/3.0.20" -i "$IPTV_URL" -t 1 -c copy -f mpegts /tmp/pre.ts -y 2>&1 | tail -n 5
            set -e

            NOW=$(date +%s)
            TARGET=$(TZ=Asia/Tokyo date -d "$JST" +%s)
            SLEEP_SEC=$((TARGET - NOW - 1))
            [ $SLEEP_SEC -gt 0 ] && sleep $SLEEP_SEC

            if ! is_online; then echo "直前オフライン"; continue; fi

            echo "recorder.ymlを起動 $JST"
            # キュー削除はrecorderに任せる前にここで削除して競合防止
            jq --arg d "$JST" 'map(select(.jst_datetime != $d))' queue.json > new.json
            mv new.json queue.json
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add queue.json
            git commit -m "dequeue $JST -> recorder" || true
            git push --quiet || { echo "競合、スキップ"; continue; }

            # recorder.ymlをdispatch
            curl -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/recorder.yml/dispatches \
              -d "{\"ref\":\"main\", \"inputs\":{\"jst_datetime\":\"$JST\", \"duration_minutes\":\"$DUR\"}}"

            echo "recorder起動完了、監視継続"
          done

      - name: 次のCheckerを自動起動
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/checker.yml/dispatches \
            -d '{"ref":"main"}' || true
