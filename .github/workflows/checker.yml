name: checker
on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: checker-queue
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: trigger parallel recorder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get install -y jq > /dev/null
          NOW=$(date +%s)
          DUE=0
          for f in queue/*.json; do
            [ -e "$f" ] || continue
            START=$(jq -r .start $f)
            if [ $START -le $NOW ]; then
              DUE=$((DUE+1))
            fi
          done
          if [ $DUE -gt 0 ]; then
            echo "$DUE件 期限到来 -> recorder-parallelを起動"
            gh workflow run recorder-parallel.yml
          fi
