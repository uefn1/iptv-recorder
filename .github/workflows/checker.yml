name: checker
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: 30分監視
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get install -y jq -qq
          for i in $(seq 1 30); do
            NOW=$(date +%s)
            for f in queue/*.json; do
              [ -e "$f" ] || continue
              ID=$(jq -r .id $f); START=$(jq -r .start $f)
              [ -f "/tmp/triggered_${ID}" ] && continue
              DIFF=$(( START - NOW ))
              if [ $DIFF -le 900 ] && [ $DIFF -ge -60 ]; then
                echo "15分前 $ID -> recorder起動"
                gh workflow run recorder-parallel.yml
                touch "/tmp/triggered_${ID}"
              fi
            done
            [ $i -lt 30 ] && sleep 60 && git pull --rebase origin main -q || true
          done
      - name: 次のchecker起動
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run checker.yml
