name: Checker
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # 10分監視 + 余裕
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 10分間常時監視
        env:
          IPTV_URL: ${{ secrets.IPTV_URL }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          set -e
          sudo apt-get install -y ffmpeg jq -qq
          curl -s https://rclone.org/install.sh | sudo bash

          R2_AK=$(echo "$R2_ACCESS_KEY" | tr -d '[:space:]')
          R2_SK=$(echo "$R2_SECRET_KEY" | tr -d '[:space:]')
          R2_ID=$(echo "$R2_ACCOUNT_ID" | tr -d '[:space:]')
          rclone config create r2 s3 provider Cloudflare access_key_id "$R2_AK" secret_access_key "$R2_SK" endpoint "https://$R2_ID.r2.cloudflarestorage.com" region auto --quiet

          START=$(date +%s)
          END=$((START + 600)) # 10分間
          echo "Watcher start $(TZ=Asia/Tokyo date) -> end in 10min"

          while [ $(date +%s) -lt $END ]; do
            git pull --rebase --quiet || true
            [ -f queue.json ] || echo '[]' > queue.json

            NOW=$(date +%s)
            # 期限切れ削除
            TMP_Q="[]"
            jq -c '.[]' queue.json > /tmp/rows.txt || true
            while IFS= read -r row; do
              [ -z "$row" ] && continue
              JST=$(echo "$row" | jq -r .jst_datetime)
              TARGET=$(TZ=Asia/Tokyo date -d "$JST" +%s)
              DIFF=$((NOW - TARGET))
              if [ $DIFF -ge 300 ]; then
                echo "[CLEAN] expired $JST"
              else
                TMP_Q=$(echo "$TMP_Q" | jq --argjson r "$row" '. += [$r]')
              fi
            done < /tmp/rows.txt
            echo "$TMP_Q" > queue.json

            # 次の録画を探す - 5分前から対象
            FOUND=""
            jq -c '.[]' queue.json > /tmp/rows.txt || true
            while IFS= read -r row; do
              JST=$(echo "$row" | jq -r .jst_datetime)
              TARGET=$(TZ=Asia/Tokyo date -d "$JST" +%s)
              REMAIN=$((TARGET - NOW))
              # 5分前(300秒前)〜過ぎて60秒以内なら準備開始
              if [ $REMAIN -le 300 ] && [ $REMAIN -ge -60 ]; then
                FOUND="$row"
                break
              fi
            done < /tmp/rows.txt

            if [ -z "$FOUND" ]; then
              echo "[$(TZ=Asia/Tokyo date '+%H:%M:%S')] 待機中... queue: $(jq length queue.json)件"
              sleep 30
              continue
            fi

            JST=$(echo "$FOUND" | jq -r .jst_datetime)
            DUR=$(echo "$FOUND" | jq -r .duration_minutes)
            TARGET=$(TZ=Asia/Tokyo date -d "$JST" +%s)
            echo ">>> 5分前検知: $JST ${DUR}分 録画準備"

            # HLS事前解析 - ストリームが生きてるかffprobeで確認し続ける
            echo "HLS解析開始 $IPTV_URL"
            for i in {1..60}; do
              if ffprobe -v error -analyzeduration 1M -probesize 1M -i "$IPTV_URL" -t 1 -f null - 2>&1 | head -n 5; then
                echo "HLS OK"
                break
              fi
              echo "HLS not ready, retry $i"
              sleep 5
            done

            # 録画時間ジャストまで待機
            NOW=$(date +%s)
            SLEEP_SEC=$((TARGET - NOW - 2)) # 2秒早めに開始して完璧に合わせる
            if [ $SLEEP_SEC -gt 0 ]; then
              echo "録画時間まで ${SLEEP_SEC}秒 待機..."
              sleep $SLEEP_SEC
            fi

            # キューから原子的に削除 - 他のCheckerと被ったら失敗する
            git pull --rebase
            jq --arg d "$JST" 'map(select(.jst_datetime != $d))' queue.json > new.json
            mv new.json queue.json
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add queue.json
            git commit -m "dequeue $JST" || true
            if ! git push; then
              echo "他Checkerが先に取得済み、スキップ"
              continue
            fi

            echo "=== 録画開始 ジャスト $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S') ==="
            SECS=$((DUR * 60))
            ffmpeg -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 30 -user_agent "VLC/3.0.20 LibVLC/3.0.20" -i "$IPTV_URL" -t $SECS -c:v libx264 -preset veryfast -crf 28 -c:a aac -b:a 96k -y rec.mp4

            FILE="rec_$(echo $JST | sed 's/[^0-9]/_/g')_${DUR}m.mp4"
            rclone copyto rec.mp4 r2:iptv-archive/videos/"$FILE" --quiet
            rclone copyto r2:iptv-archive/manifest.json ./manifest.json 2>/dev/null || true
            [ -f manifest.json ] || echo '{"videos":[]}' > manifest.json
            URL="$R2_PUBLIC_URL/videos/$FILE"
            jq --arg t "録画 $JST ${DUR}分" --arg f "$FILE" --arg u "$URL" --arg d "$(date -Iseconds)" '.videos |= [{title:$t, filename:$f, url:$u, recorded_at:$d}] + .' manifest.json > new.json
            mv new.json manifest.json
            rclone copyto ./manifest.json r2:iptv-archive/manifest.json --quiet
            echo "=== 録画完了 ==="

            # 録画が長くて10分枠を超えたらこのWatcherはここで終了、次の10分Checkerに引き継ぎ
            if [ $(date +%s) -ge $END ]; then
              echo "10分枠終了、次Checkerに引き継ぎ"
              exit 0
            fi
          done

          echo "10分監視終了 - 次のCheckerが自動起動します"
