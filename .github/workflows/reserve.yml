name: reserve

on:
  workflow_dispatch:
    inputs:
      year:
        description: "年 (例: 2026)"
        required: true
        type: string
      month:
        description: "月 (1-12)"
        required: true
        type: string
      day:
        description: "日 (1-31)"
        required: true
        type: string
      hour:
        description: "時 (0-23)"
        required: true
        type: string
      minute:
        description: "分 (0-59)"
        required: true
        default: "0"
        type: string
      duration:
        description: "録画分数 (例: 60で1時間)"
        required: true
        default: "60"
        type: string

jobs:
  reserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: add queue file
        run: |
          YEAR="${{ inputs.year }}"
          MONTH=$(printf "%02d" ${{ inputs.month }})
          DAY=$(printf "%02d" ${{ inputs.day }})
          HOUR=$(printf "%02d" ${{ inputs.hour }})
          MIN=$(printf "%02d" ${{ inputs.minute }})
          
          JST_STR="$YEAR-$MONTH-$DAY $HOUR:$MIN:00"
          START_EPOCH=$(TZ=Asia/Tokyo date -d "$JST_STR" +%s)
          DURATION_SEC=$(( ${{ inputs.duration }} * 60 ))

          ID="${START_EPOCH}_$RANDOM"
          mkdir -p queue

          cat > queue/${ID}.json <<EOF
          {
            "id": "$ID",
            "start": $START_EPOCH,
            "start_jst": "$JST_STR",
            "duration": "$DURATION_SEC",
            "duration_min": "${{ inputs.duration }}",
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          cat queue/${ID}.json

          git config user.name "uefn1"
          git config user.email "uefn1@users.noreply.github.com"
          git add queue/${ID}.json
          git commit -m "reserve $JST_STR ${{ inputs.duration }}min [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: summary
        run: |
          echo "### 予約完了" >> $GITHUB_STEP_SUMMARY
          echo "- 開始: ${{ inputs.year }}/${{ inputs.month }}/${{ inputs.day }} ${{ inputs.hour }}:${{ inputs.minute }} JST" >> $GITHUB_STEP_SUMMARY
          echo "- 録画: ${{ inputs.duration }}分" >> $GITHUB_STEP_SUMMARY
