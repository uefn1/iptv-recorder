name: reserve
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'チャンネル名 (config.jsonのkey)'
        required: true
        type: string
      id:
        description: '録画ID'
        required: true
        type: string
      start_jst:
        description: '開始 JST (2026-05-13 21:00)'
        required: true
        type: string
      duration:
        description: '秒数'
        required: true
        default: '3600'
permissions:
  contents: write
jobs:
  reserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: create queue
        run: |
          sudo apt-get install -y jq -qq
          CH="${{ inputs.channel }}"
          URL=$(jq -r --arg ch "$CH" '.channels[$ch]' config.json)
          if [ "$URL" = "null" ] || [ -z "$URL" ]; then echo "channel $CH not found"; jq -r '.channels | keys' config.json; exit 1; fi
          START=$(TZ=Asia/Tokyo date -d "${{ inputs.start_jst }}" +%s)
          mkdir -p queue
          jq -n --arg id "${{ inputs.id }}" --arg ch "$CH" --arg url "$URL" --argjson start "$START" --arg start_jst "${{ inputs.start_jst }}" --argjson duration "${{ inputs.duration }}" \
            '{id:$id, channel:$ch, url:$url, start:$start, start_jst:$start_jst, duration:$duration}' > queue/${{ inputs.id }}.json
          cat queue/${{ inputs.id }}.json
      - name: push
        run: |
          git config user.name "uefn1"
          git config user.email "uefn1@users.noreply.github.com"
          git add queue/
          git commit -m "reserve ${{ inputs.id }} ${{ inputs.channel }} [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin main
      - name: ensure checker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run checker.yml || true
