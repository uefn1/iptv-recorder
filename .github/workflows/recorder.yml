name: recorder
on:
  workflow_dispatch:
    inputs:
      id:
        required: true
        type: string
      url:
        required: true
        type: string
      duration:
        required: true
        type: string

concurrency:
  group: recorder-${{ inputs.id }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 400
    steps:
      - uses: actions/checkout@v4
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: record
        run: |
          mkdir -p recordings
          ffmpeg -i "${{ inputs.url }}" -t "${{ inputs.duration }}" -c copy recordings/${{ inputs.id }}.ts
      - name: cleanup
        run: |
          git config user.name "uefn1"
          git config user.email "uefn1@users.noreply.github.com"
          rm -f queue/${{ inputs.id }}.json
          git add -A
          git commit -m "done ${{ inputs.id }} [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin main
