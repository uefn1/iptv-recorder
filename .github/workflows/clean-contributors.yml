name: recorder-parallel
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 400
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg jq

      - name: parallel recording
        run: |
          mkdir -p recordings/raw
          URL=$(jq -r .url config.json 2>/dev/null || echo "${{ secrets.M3U_URL }}")
          for f in queue/*.json; do
            [ -e "$f" ] || continue
            ID=$(jq -r .id $f)
            DUR=$(jq -r .duration $f)
            OPTS="-reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 60 -rw_timeout 15000000"
            ffmpeg -y $OPTS -i "$URL" -t "$DUR" -c copy "recordings/raw/${ID}_a.ts" &
            ffmpeg -y $OPTS -i "$URL" -t "$DUR" -c copy "recordings/raw/${ID}_b.ts" &
            ffmpeg -y $OPTS -i "$URL" -t "$DUR" -c copy "recordings/raw/${ID}_c.ts" &
            wait
            # 最良を選ぶ
            BEST=$(ls -S recordings/raw/${ID}_*.ts | head -n1)
            cp "$BEST" "recordings/raw/${ID}_best.ts"
            rm -f recordings/raw/${ID}_a.ts recordings/raw/${ID}_b.ts recordings/raw/${ID}_c.ts
            echo "$ID" >> /tmp/done.txt
          done

      - name: push raw and trigger encode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "uefn1"
          git config user.email "uefn1@users.noreply.github.com"
          git add recordings/raw/ queue/
          git commit -m "raw done [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin main
          # エンコードymlを起動
          for ID in $(cat /tmp/done.txt); do
            gh workflow run encoder.yml -f id=$ID
          done
